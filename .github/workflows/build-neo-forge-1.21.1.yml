name: Build Dango Music (NeoForge 1.21.1)

on:
  workflow_dispatch:
  push:
    paths:
      - 'DangoMusic-local-music-source-M4A-decoder.zip'
      - '.github/workflows/build-neo-forge-1.21.1.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source
        run: |
          unzip -q DangoMusic-local-music-source-M4A-decoder.zip -d .

      - name: Build NeoForge 1.21.1
        run: |
          cd DangoMusic-main
          chmod +x modern/gradlew
          modern/gradlew -p modern :1.21.1-neoforge:remapJar --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-1.7.6-1.21.1-neoforge-M4A
          path: DangoMusic-main/modern/versions/1.21.1-neoforge/build/libs/*neoforge.jar
          if-no-files-found: error
          
